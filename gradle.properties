# InkLeaf — 构建属性
#
# 本机 JDK 说明：
#   本机没有独立的 JDK，只有 Android Studio 自带的 JBR 25.0.3。
#   Gradle 通过 %USERPROFILE%\.gradle\gradle.properties 里的
#   org.gradle.java.home 指向该 JBR（机器级配置，不进仓库，避免写死绝对路径）。
#   Gradle 9.6.0 支持在 Java 25 上运行（Gradle 9.1.0 起支持 Java 25）。

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX（方案 §0.1）
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
