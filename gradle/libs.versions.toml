# InkLeaf 版本目录 —— 全工程唯一的版本事实来源
#
# 原则（见 design/方案设计.md §3）：
#   1. 全部精确版本，禁止 "+" / "latest.release" / 动态版本。
#   2. **这里只放"确实被模块引用"的依赖。** 目录一旦写进没被引用的条目，
#      下一个人就会以为它在用 —— `androidx.ink` 曾经在这里挂了 8 条、标着
#      "已启用/已锁定"，而全仓库对它 0 处 import（笔迹引擎是自研的，见
#      `core/ink/build.gradle.kts` 的 M3b 记录）。标"未启用"也不够：
#      标签不会拦任何人，只有"不在目录里"才是事实上没有。
#   3. 暂时不用的依赖连同版本号一起记在文件末尾的**文字清单**里（§未启用清单），
#      不进入 [versions] / [libraries]。真要用时再抄回来，理由一并带着走。

[versions]
# ---- 构建链（与本机环境实测匹配，见 §3.1 与 M0 说明）----
# Android Studio 2026.2 支持 AGP 7.1–9.4；AGP 9.4 要求 Gradle >= 9.6.0
# AGP 9.x 的最大 API level = 37；本机已装 platform android-37.0 与 build-tools 36.0.0
# 本机 JDK = Android Studio 自带 JBR 25.0.3；Gradle 运行在 Java 25 上需要 >= 9.1.0，9.6.0 满足
agp = "9.4.0"
kotlin = "2.4.21"
# 本机目标平台：minSdk 31 / targetSdk 36（方案 §3.1 的决策）/ compileSdk 37
# compileSdk 必须是 37：Compose 1.12+ 要求 compileSdk 37 + AGP 9
compileSdk = "37"
targetSdk = "36"
minSdk = "31"

# ---- 应用层（当前启用）----
composeBom = "2026.09.00"
activityCompose = "1.13.0"
junit = "4.13.2"
# Robolectric：让"必须依赖 Android 真实实现"的测试也能在 JVM 上执行。
#   1. native graphics 走真实 Skia → StaticLayout 是**真的**在排版（不是桩）；
#   2. SQLite / SQLiteOpenHelper / 外键 / BLOB 都是真实实现。
# 选择它而不是 connectedAndroidTest 的原因写在 core/data 与 core/document 的测试文件头：
# 本机没有虚拟化（HypervisorPresent=False，AEHD 未装，开 WHPX 需要管理员+重启），
# 设备测试在这台机器上**永远跑不起来**，而跑不起来的测试会烂掉。
robolectric = "4.17"
coreKtx = "1.19.1"

# ---- 基建 ----
lifecycle = "2.11.0"
serialization = "1.11.0"

# ---- [已启用] 测试 ----
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
espresso = "3.7.0"

coroutines = "1.11.0"

# ★ 已移除：room = "2.8.5" 与 hilt = "2.60.1"
#   原因（2026-10-17 实测，不是偏好）：
#     1. Room / Hilt 都要注解处理（KSP 或 KAPT）。AGP 9 的内建 Kotlin 不提供 KAPT。
#     2. KSP 官方最新发布版 = 2.3.12，其 POM 里 kotlin-stdlib 是 2.3.20；
#        而本工程 Kotlin 版本被 AGP 9 的内建 Kotlin 钉在 2.4.21（见 [plugins] 注释），
#        不存在与 Kotlin 2.4.x 配套的 KSP 版本。
#     3. 结论：不存在可用的注解处理链路 → 持久层改为手写 SQLite（SQLiteOpenHelper），
#        依赖注入改为手写容器。
#   收益不只是"能构建"：手写 SQLite 让 BLOB 外置、op_log 单调 seq、
#   全库导出这些需求可以直接控制事务边界，且不需要为它引入代码生成。

[libraries]
# ---- 当前启用 ----
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
compose-ui-unit = { group = "androidx.compose.ui", name = "ui-unit" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 图标只要 core 这一份（Add / Search / Settings / 箭头这一批常用图标）。
# **不要**换回 material-icons-extended：它把 5000 多个图标全编进 dex，
# 而本项目实际只用 12 个 extended 独有图标，已经抄进 InkIcons.kt（M37）。
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- 测试 ----
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
# 设备端（connectedAndroidTest）用 Compose 测试：它注入的是**真实**的 MotionEvent，
# 走真实的窗口分发 —— Robolectric 里没有这一层（见 M7 记录）。
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# ★ 这里没有 org.jetbrains.kotlin.android，而且不能加。
#   AGP 9.0 起 Kotlin 支持已内建（built-in Kotlin，默认开启）；
#   再应用 kotlin-android 会直接构建失败：
#     "The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin support since AGP 9.0."
#   Android 模块（:app 等）因此完全不声明 Kotlin 插件，KGP 由 AGP 带入 classpath；
#   纯 Kotlin JVM 模块（:core:model / :core:anchoring）才用下面这个 kotlin-jvm。
#   两者共用同一个 `kotlin` 版本号：Gradle 取 classpath 上的最高版，因此这里写 2.4.21
#   会把 AGP 自带的 KGP 一并提升到 2.4.21 —— compose 编译插件必须与它同版，
#   这正是把 kotlin / kotlin-compose / kotlin-serialization 指向同一个 version.ref 的原因。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# ─────────────────────────────────────────────────────────────────────────────
# 未启用清单（M43/J6）
#
# 下面这些**故意不在** [versions] / [libraries] 里。写在这里的用途只有一个：
# 记下"当初定的是哪个版本、为什么" —— 将来真要用时不必重开一次选型会。
#
# 判断一条该不该留在这份清单里：它是否有"因为某个外部约束而必须锁在某个版本"的
# 事实。纯顺手加的基建（导航库、DocumentFile、ProfileInstaller）不满足，直接删了。
#
#   Jetpack Ink 1.0.0（稳定版 2025-12-17）
#     ink-authoring / -compose / -strokes / -brush / -geometry / -rendering /
#     -storage / -nativeloader
#     ✗ 不用。**本项目的笔迹引擎是自研的**（Path + 自绘墨层），
#       理由与实测见 core/ink/build.gradle.kts 的 M3b 记录：无真机证据证明
#       InProgressStrokesView 更快，而它会把手势链路的控制权交出去。
#     若要重新评估：ink-storage 只序列化 StrokeInputBatch，Brush 必须自己序列化；
#     protobuf 编码只有 Ink 自己能读，升级即可能读不出历史笔迹 —— 必须配 golden 回归。
#
#   androidx.pdf 1.0.0-beta01
#     pdf-viewer-fragment / pdf-ink
#     ✗ 不用。PDF 走平台 PdfRenderer + 手写文本层探测（core/document）。
#       注意 pdf-ink 会反向锁定 androidx.ink:* = 1.0.0，用它会连带把上面的 Ink 拉回来。
#
#   Readium Kotlin Toolkit 3.4.0
#     readium-shared / -streamer / -navigator
#     ✗ 不用。EPUB 用自研 500 行 HTML 扫描器（只认结构，不实现 CSS）。
#       换 Readium 会把 EPUB 的解析与排版一起接管，代价远大于收益。
#
#   CommonMark 0.30.1
#     ✗ 不用。Markdown 走自研正则子集（标题/引用/列表/强调/代码/分隔线），
#       够用且没有一块依赖需要跟着升级。
#
#   androidx.navigation 2.10.2 / androidx.documentfile 1.1.0 /
#   androidx.profileinstaller 1.4.1
#     ✗ 不用，且没有"版本锁"的理由，所以连版本都删了。
#       导航是手写的 sealed route + 单个 Activity（MainActivity）；
#       文件访问只走 SAF 的 ContentResolver（不遍历目录树）；
#       Baseline Profile 未做（做了再按需加回）。
#
# 自查：`tools/check-catalog.sh` 会对比"目录里的别名"与"模块里实际引用的别名"，
# 两边不一致就报错。改完目录顺手跑一次。
