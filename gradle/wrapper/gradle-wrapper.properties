distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ★ 这里指向腾讯云镜像，而不是 Gradle 官方地址。
#
#   原因（2026-10-17 实测）：官方地址
#     https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
#   会 307 跳转到 GitHub Releases，而本机所在网络访问 github.com 连接超时。
#   也就是说官方地址在本机**必然失败**，不是"慢"的问题。
#
#   若在能访问 GitHub 的网络（例如 CI runner）上构建，把下面这行换回官方地址即可：
#     distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
#
#   注意：Gradle 按 distributionUrl 的哈希串缓存解压结果，两边切换会各自下载一份。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.6.0-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
